services:
  privacy-proxy:
    build:
      context: .
      dockerfile: apps/proxy/Dockerfile
    environment:
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-https://api.openai.com}
      PRESIDIO_URL: http://presidio:5000
      REDIS_URL: redis://redis:6379
      PRIVACY_MODE: ${PRIVACY_MODE:-strict}
      VAULT_TTL_SECONDS: ${VAULT_TTL_SECONDS:-3600}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-admin-secret-key-change-me}
    volumes:
      - ./data:/app/apps/proxy/data
    depends_on:
      presidio:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  presidio:
    build:
      context: apps/presidio
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:

networks:
  default:
    name: ai-privacy-proxy-network
